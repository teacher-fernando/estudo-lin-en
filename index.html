const themes=[{"id": 1, "icon": "🌎", "title": "Aprender na Extensão — Projetos Inovadores com Impacto Social", "color": "#8b5cf6", "blocks": [["🎯 O foco do tema", "A aprendizagem pode ultrapassar a sala de aula e se conectar a projetos, comunidade e problemas sociais concretos. A extensão aproxima universidade e sociedade e transforma conhecimento em ação."], ["🤝 Extensão + aprendizagem", "Projetos extensionistas favorecem participação, colaboração, resolução de problemas e aprendizagem contextualizada. O conhecimento não deve circular em uma única direção: universidade e comunidade podem aprender mutuamente."], ["💡 Impacto social", "Um projeto inovador não é apenas 'tecnológico'. Ele deve responder a uma necessidade real, envolver os participantes e produzir algum impacto social, educacional ou comunitário verificável."], ["🧩 O que lembrar", "PROBLEMA REAL → PARTICIPAÇÃO → AÇÃO/PROJETO → REFLEXÃO → IMPACTO SOCIAL. Em uma prova, procure alternativas que aproximem conhecimento acadêmico, comunidade e transformação social."]]}, {"id": 2, "icon": "🔬", "title": "O que é Linguística Aplicada", "color": "#06b6d4", "blocks": [["🎯 Definição essencial", "Linguística Aplicada (LA) é um campo de investigação voltado a problemas reais relacionados à linguagem. Ela não é simplesmente 'aplicar teorias da Linguística'; constrói conhecimento em diálogo com diferentes áreas."], ["🌐 Transdisciplinaridade", "A LA contemporânea é transdisciplinar, indisciplinar e intercultural. Pode dialogar com educação, psicologia, sociologia, antropologia, estudos culturais e outras áreas para compreender problemas linguísticos complexos."], ["⚔️ Origem histórica", "A consolidação da LA está ligada ao ensino de línguas e à Segunda Guerra Mundial, quando havia grande demanda por aprendizagem rápida de línguas para fins militares. Behaviorismo, linguística contrastiva e laboratórios de línguas marcaram o período inicial."], ["🇧🇷 LA no Brasil", "Inicialmente muito ligada à Linguística e Educação/ensino de línguas, a LA brasileira ampliou seu campo para identidade, etnia, gênero, sexualidade, letramentos, leitura, escrita e outras questões sociais."], ["🔥 Linguística Aplicada Crítica", "A LAC busca tornar visíveis relações entre linguagem, poder, desigualdade e hegemonia. Assume compromisso crítico e pode ter engajamento político situado em contextos geopolíticos e sócio-históricos."], ["📖 Leitura e escrita", "A LA brasileira teve preocupação histórica com leitura e escrita e continua investigando essas práticas, inclusive sua relação com formação docente e letramentos."], ["💡 Decore", "LA = PROBLEMAS REAIS DE LINGUAGEM. É TRANS/INDISCIPLINAR. ORIGEM FORTE NO ENSINO DE LÍNGUAS + CONTEXTO DE GUERRA. LAC = LINGUAGEM + PODER + DESIGUALDADE."]]}, {"id": 3, "icon": "🧑‍🏫", "title": "Linguística Aplicada ao Ensino", "color": "#22c55e", "blocks": [["🎯 Ensino de língua materna", "O ensino deve ser contextualizado, considerar a realidade do aluno e aproximar língua e mundo real. Deve integrar leitura, escrita, fala, texto e reflexão gramatical."], ["🗣️ Variação linguística", "As variedades linguísticas são legítimas e ligadas a fatores sociais, regionais, históricos e situacionais. O professor deve combater o preconceito linguístico e, ao mesmo tempo, ensinar a variedade de prestígio necessária em contextos formais."], ["🏛️ Norma culta", "A norma culta/padrão é uma variedade socialmente valorizada, não uma língua 'pura' ou superior. Seu prestígio está relacionado a fatores históricos, sociais, políticos e culturais e ao poder de grupos socialmente mais instruídos."], ["🧠 Sociolinguística", "A sala de aula pode incorporar diferentes variedades para mostrar que os usos têm motivações e funções. Ensinar a norma de prestígio não exige desvalorizar as outras formas de falar."], ["💬 Pragmática", "Analisa linguagem em contexto: intenção, situação comunicativa, comportamento, relações entre interlocutores e conhecimentos extralinguísticos. Ajuda a compreender implicaturas e sentidos que não estão literalmente escritos."], ["📚 Leitura", "A leitura não deve ser reduzida à decodificação. Uma abordagem ampla considera processos cognitivos e, sobretudo, a leitura como prática social e interação entre texto, leitor e contexto."], ["💡 Decore", "PROFESSOR = ACOLHE VARIAÇÃO + COMBATE PRECONCEITO + ENSINA NORMA DE PRESTÍGIO. PRAGMÁTICA = CONTEXTO + INTENÇÃO + INFERÊNCIA. LEITURA = INTERAÇÃO, NÃO SÓ DECODIFICAÇÃO."]]}, {"id": 4, "icon": "🔤", "title": "Níveis de Análise Linguística e Ensino", "color": "#f59e0b", "blocks": [["🔊 Fonologia", "Fonema é a menor unidade sonora capaz de diferenciar significado. Ex.: caça/casa diferem pelo fonema /s/ versus /z/. Fonologia trata da organização dos sons na língua."], ["✍️ Fonologia × ortografia", "Letra e fonema não são a mesma coisa. Uma letra pode não ter som (h em 'hebreu') e uma letra pode representar mais de um fonema em determinados contextos (x em 'sexo')."], ["🧩 Sílabas", "Na estrutura silábica, o núcleo é geralmente a vogal; a consoante depois do núcleo é a coda. Ataque vem antes do núcleo."], ["🧱 Sintaxe", "A análise sintática observa a função dos termos na oração. Sujeito oculto é recuperável pelo contexto/forma verbal: em 'Achei a bola', o sujeito é 'eu', não expresso."], ["💬 Pragmática e implicatura", "O sentido pode ultrapassar o significado literal. 'Um cafezinho agora caía bem, não?' pode funcionar como uma sugestão/pedido implícito."], ["🧠 Gerativismo", "O argumento da criatividade linguística é usado contra uma visão behaviorista baseada apenas em estímulo e repetição: falantes produzem e compreendem enunciados novos."], ["⚖️ Análise do Discurso Crítica", "A ADC relaciona linguagem e sociedade e investiga como discurso, poder e ideologia se articulam nas práticas sociais."], ["💡 Decore", "FONEMA = DIFERENCIA SIGNIFICADOS. CODA = CONSOANTE DEPOIS DO NÚCLEO. SUJEITO OCULTO = NÃO APARECE, MAS É RECUPERÁVEL. IMPLICATURA = SENTIDO INFERIDO."]]}, {"id": 5, "icon": "🌐", "title": "Linguística e Educação Bilíngue", "color": "#ec4899", "blocks": [["🌍 Bilinguismo", "Bilinguismo não precisa significar domínio perfeito e equilibrado de duas línguas. Grosjean considera situações diversas de uso funcional de duas línguas, inclusive compreensão, leitura/escrita básica e alternância conforme necessidades."], ["📊 Multidimensionalidade", "O estudo do bilinguismo envolve grau de proficiência, função/uso, alternância e aspectos ligados ao indivíduo e ao contexto. A Linguística não é a única área relevante."], ["🏫 Educação bilíngue", "A demanda por educação bilíngue cresceu no Brasil. O ensino bilíngue envolve aspectos linguísticos, sociais, culturais e educacionais, e não deve ser reduzido a 'mais aulas de inglês'."], ["🔄 Modelos de Hornberger", "Transição: a língua materna/minoritária funciona como meio para chegar à língua dominante. Manutenção: busca preservar a língua de origem. Enriquecimento: amplia repertórios linguísticos sem substituir necessariamente a língua de origem."], ["🇧🇷 Brasil multilíngue", "O Brasil não é linguisticamente monolíngue: além do português, existem línguas indígenas, de imigração, línguas de comunidades quilombolas e Libras, entre outras."], ["🏛️ Políticas linguísticas", "Políticas linguísticas envolvem decisões sobre relações entre sociedade e línguas em diferentes escalas. O IPOL atua com pesquisa, projetos, apoio a comunidades linguísticas e cooficialização de línguas."], ["🧠 Benefícios", "O material relaciona bilinguismo a competências interculturais, ampliação de repertório e aspectos cognitivos. Evite a ideia de que duas línguas necessariamente 'atrapalham' a língua materna."], ["💡 Decore", "TRANSIÇÃO = LÍNGUA DE ORIGEM → LÍNGUA DOMINANTE. MANUTENÇÃO = PRESERVAR LÍNGUA. ENRIQUECIMENTO = AMPLIAR REPERTÓRIO. BILINGUISMO ≠ PERFEIÇÃO EM DUAS LÍNGUAS."]]}, {"id": 6, "icon": "📚", "title": "Produção de Materiais Didáticos", "color": "#ef4444", "blocks": [["🎯 Material didático", "Um bom material articula conteúdo, objetivos, metodologia, linguagem, design e perfil do estudante. Em EaD, pode integrar texto, videoaulas, AVA e outros recursos."], ["💬 Dialogismo", "Na concepção dialógica, sujeitos são atores/construtores sociais e o texto é lugar de interação. O sentido não é simplesmente 'retirado' do texto: é construído na interação texto/sujeito."], ["👋 Linguagem dialógica", "Recursos como primeira pessoa do plural ('vamos analisar') e pronome 'você' aproximam autor e estudante e favorecem interação. Impessoalização excessiva pode tornar o material distante."], ["🎨 Multimodalidade", "Um material multimodal integra diferentes modos de linguagem: escrita, imagem, som, vídeo, cores, animação e outros recursos. Tecnologia pode ampliar as possibilidades didáticas."], ["🌎 Multiletramentos", "A pluralidade de linguagens e mídias exige novas práticas de leitura e escrita. O estudante interpreta sentidos construídos por diferentes modos e suportes."], ["🧩 Conhecimentos do conteudista", "São importantes conhecimentos linguísticos, enciclopédicos, de padrões textuais e interacionais. O vocabulário e o estilo devem ser adequados ao público-alvo."], ["🔎 Exercícios e coerência", "Atividades precisam estar alinhadas aos objetivos e à metodologia. Uma atividade de gramática reflexiva deve estimular comparação, observação e reflexão sobre usos, e não apenas memorização de listas."], ["💡 Decore", "DIALOGISMO = INTERAÇÃO. MULTIMODALIDADE = VÁRIOS MODOS. MULTILETRAMENTO = NOVAS PRÁTICAS DE LEITURA/ESCRITA. MATERIAL BOM = OBJETIVO + CONTEÚDO + METODOLOGIA + PÚBLICO."]]}];
const exerciseData={"2": [["Um dos aspectos mais importantes da Linguística Aplicada é sua interface com outras disciplinas. Isso ocorre:", "A", ["pela necessidade de resolver problemas do mundo real em que a linguagem é elemento central.", "porque a LA depende da política para explicar os fenômenos linguísticos.", "por buscar dogmas teóricos em outras disciplinas.", "porque desde a origem colaborou com todas as disciplinas científicas.", "por dar respaldo aos estudos de gramática."], "A interface existe porque a LA enfrenta problemas reais e complexos de linguagem."], ["No ensino de língua materna, de acordo com os estudos da LA, quais afirmações estão corretas?", "E", ["Apenas I.", "I e II.", "I e III.", "II e III.", "I, II e III."], "As três afirmações defendem contextualização, integração das habilidades e aproximação com o mundo real."], ["As condições favoráveis ao surgimento da Linguística Aplicada incluíram:", "B", ["grande investimento, estudo comparativo, laboratórios e fins militares.", "grande investimento, métodos behavioristas, capacitação militar e laboratórios de línguas.", "baixo investimento, laboratórios, fins militares e linguística contrastiva.", "behaviorismo, laboratórios, estudo sincrônico e linguística contrastiva.", "preocupações geopolíticas, métodos comparativos e estudos sincrônicos."], "O material associa o início da LA ao investimento em línguas, behaviorismo, treinamento militar e laboratórios."], ["A LA, após ultrapassar os limites iniciais do ensino de línguas, caracteriza-se hoje por:", "B", ["foco exclusivo em semântica.", "maior teorização e transdisciplinaridade, com identidade, etnia, sexualidade e gênero.", "preocupação social restrita ao letramento digital.", "busca por autonomia sem diálogo com outras disciplinas.", "uso da linguagem sem contexto social."], "A LA contemporânea ampliou temas e assumiu caráter transdisciplinar."], ["A Linguística Aplicada Crítica:", "E", ["ignora temas controversos.", "é restrita ao saber linguístico.", "defende caráter unidisciplinar.", "evita engajamento político.", "promove consciência do domínio da língua e assume engajamento político situado."], "A LAC relaciona linguagem, poder e hegemonia e assume compromisso crítico."], ["Uma diferenciação adequada entre Linguística Aplicada e Linguística é:", "E", ["LA só pesquisa segunda língua.", "LA pesquisa apenas inglês; Linguística ensina línguas.", "LA trabalha etimologia; Linguística trabalha fala.", "LA trabalha poder; Linguística resolve globalização.", "LA pode focar linguagem, poder e hegemonia, enquanto a Linguística pode descrever a língua sem necessariamente focar implicações sociais."], "Essa é a distinção apresentada no exercício."], ["Até o final do século XX, pesquisas em LA enfatizaram:", "A", ["descrição das línguas, elaboração de material didático e testagem.", "produção escrita, planejamento de cursos e etimologia.", "fraseologia, avaliação e aquisição de L2.", "diacronia, análise de erros e compreensão oral.", "formação docente, descrição e leitura."], "O exercício aponta descrição, materiais didáticos e testagem como foco histórico."], ["Sobre Linguística Aplicada, é correto afirmar que:", "D", ["resolve problemas teóricos de escrita.", "é apenas desenvolvimento da Linguística para língua materna.", "desenvolve somente metodologias de fala.", "é campo transdisciplinar, indisciplinar e intercultural voltado a problemas de linguagem.", "surgiu antes da Segunda Guerra Mundial."], "Essa é a definição contemporânea destacada pelo material."], ["A revisão conceitual da LA e sua consolidação científica ocorreu especialmente:", "C", ["para estudar línguas-mãe.", "por preservação política de línguas nativas.", "durante a Segunda Guerra Mundial, ligada ao ensino de línguas para soldados americanos.", "pela queda do inglês.", "para promover o francês."], "O contexto da Segunda Guerra é central para a história inicial da LA."], ["A LA surgiu no mundo anglófono associada ao ensino de inglês, mas:", "  document.getElementById('mobilebar').innerHTML='<button data-view="home" onclick="go(\'home\')">🏠<br>Início</button><button data-view="theory" onclick="go(\'theory\',1)">🧠<br>Teoria</button><button data-view="exercises" onclick="go(\'exercises\',2)">🎯<br>Exercícios</button><button data-view="simulations" onclick="go(\'simulations\')">📝<br>Simulado</button>';updateNav()
}
function render(v,id){if(v==='home')home();if(v==='theory')theory(id);if(v==='exercises')exercises(id);if(v==='simulations')simulation()}
function home(){
document.getElementById('home').innerHTML=`<div class="simintro"><div class="eyebrow">Plano de emergência</div><h2>Como estudar se você não viu a matéria?</h2><p><b>1.</b> Leia o card 💡 Decore de cada tema. <b>2.</b> Leia os blocos principais. <b>3.</b> Faça os exercícios sem olhar o gabarito. <b>4.</b> Faça o simulado completo. <b>5.</b> Revise apenas os erros.</p><div class="controls"><button class="btn primary" onclick="go('theory',1)">Começar pelo Tema 1</button><button class="btn" onclick="go('simulations')">Fazer Simulado</button></div></div>
<div class="section-head"><h2>6 temas</h2><span class="small">Tema 1 não possui lista de exercícios no material enviado.</span></div>
<div class="cards">${themes.map(t=>`<div class="card theme-card" onclick="go('theory',${t.id})" style="border-top:3px solid ${t.color}"><div class="theme-icon">${t.icon}</div><h3>Tema ${t.id} · ${esc(t.title)}</h3><p>${esc(t.blocks[0][1]).slice(0,185)}…</p><div style="margin-top:9px"><span class="pill">${exerciseData[t.id]?exerciseData[t.id].length+' exercícios':'teoria'}</span></div></div>`).join('')}</div>
<div class="section-head"><h2>🔥 O que decorar primeiro</h2></div><div class="cards"><div class="card"><h3>LA</h3><p>Problemas reais de linguagem + transdisciplinaridade + contexto social.</p></div><div class="card"><h3>Ensino</h3><p>Variação não é erro. Ensine a norma de prestígio sem preconceito linguístico.</p></div><div class="card"><h3>Bilinguismo</h3><p>Não exige perfeição. Transição = língua de origem → língua dominante.</p></div><div class="card"><h3>Material didático</h3><p>Dialogismo + multimodalidade + multiletramentos + adequação ao público.</p></div></div>`
}
function theory(id){
const t=themes.find(x=>x.id===id);document.getElementById('theory').innerHTML=`<div class="section-head"><div><div class="eyebrow">Crash Course</div><h2>${t.icon} Tema ${t.id} — ${esc(t.title)}</h2></div></div><div class="controls">${themes.map(x=>`<button class="btn ${x.id===id?'primary':''}" onclick="go('theory',${x.id})">${x.icon} T${x.id}</button>`).join('')}</div>${t.blocks.map(([h,p])=>`<div class="theory-block ${h.startsWith('💡')?'memorize':''}"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')}<div class="controls">${exerciseData[id]?`<button class="btn primary" onclick="go('exercises',${id})">🎯 Praticar Tema ${id}</button>`:''}</div>`
}
function exercises(id){
const data=exerciseData[id];if(!data){document.getElementById('exercises').innerHTML='<div class="simintro"><h2>O Tema 1 não possui uma lista de exercícios no material enviado.</h2><p>Use o Crash Course e depois avance para o Tema 2.</p><button class="btn primary" onclick="go(\'theory\',1)">Voltar à teoria</button></div>';return}
document.getElementById('exercises').innerHTML=`<div class="scorebar"><div><b>🎯 Exercícios — Tema ${id}</b><div class="small">Clique em uma alternativa para corrigir.</div></div><div>${data.length} questões</div></div><div class="controls">${Object.keys(exerciseData).map(x=>`<button class="btn ${+x===id?'primary':''}" onclick="go('exercises',${x})">T${x}</button>`).join('')}</div>${data.map((q,i)=>qhtml(q,i,'e'+id+'-'+i)).join('')}`
}
function qhtml(q,i,key,sim=false){
return `<article class="${sim?'simq':'exercise'}" data-search="${esc(q[0]+' '+q[3])}"><div class="qtop"><span class="qnum">QUESTÃO ${i+1}</span><span class="pill">${sim?'Simulado':'Fixação'}</span></div><div class="question">${esc(q[0])}</div><div class="options">${q[2].map((o,j)=>`<button class="option" data-key="${key}" data-letter="${letters[j]}" onclick="${sim?`simPick(${i},'${letters[j]}',this)`: `pick(this,'${key}','${q[1]}')`}"><span class="letter">${letters[j]}</span>${esc(o)}</button>`).join('')}</div>${sim?`<div class="answer" id="ans-${key}"><strong>Gabarito: ${q[1]}</strong><br>${esc(q[3])}</div>`:`<div class="answer" id="ans-${key}"><strong>✓ Gabarito: ${q[1]}</strong><br>${esc(q[3])}</div>`}</article>`
}
function pick(btn,key,correct){document.querySelectorAll(`[data-key="${key}"]`).forEach(b=>b.classList.remove('correct','wrong','selected'));btn.classList.add('selected');document.querySelectorAll(`[data-key="${key}"]`).forEach(b=>{if(b.dataset.letter===correct)b.classList.add('correct')});if(btn.dataset.letter!==correct)btn.classList.add('wrong');document.getElementById('ans-'+key).classList.add('show')}
function simulation(){
document.getElementById('simulations').innerHTML=`<div class="simintro"><div class="eyebrow">Simulado Final</div><h2>📝 Simulado de Linguística e Ensino de Letras</h2><p>${simQuestions.length} questões inspiradas nos simulados e listas enviados. Faça sem consultar. No final, veja sua nota e as explicações.</p><div class="controls"><button class="btn primary" onclick="finishSim()">🏁 Finalizar</button><button class="btn" onclick="resetSim()">↻ Reiniciar</button></div><div id="simresult"></div></div><div id="simquestions">${simQuestions.map((q,i)=>qhtml(q,i,'s'+i,true)).join('')}</div>`
}
function simPick(i,l,b){simAnswers[i]=l;document.querySelectorAll(`[data-key="s${i}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function finishSim(){let score=0;simQuestions.forEach((q,i)=>{if(simAnswers[i]===q[1])score++;document.getElementById('ans-s'+i).classList.add('show');document.querySelectorAll(`[data-key="s${i}"]`).forEach(b=>{b.classList.remove('correct','wrong');if(b.dataset.letter===q[1])b.classList.add('correct');else if(simAnswers[i]===b.dataset.letter)b.classList.add('wrong')})});let pct=Math.round(score/simQuestions.length*100);document.getElementById('simresult').innerHTML=`<div class="result">${score}/${simQuestions.length} — ${pct}%</div><div class="small">${pct>=80?'Revise só os pontos em que errou.':pct>=60?'Boa base. Volte aos temas dos erros.':'Faça uma revisão completa dos Crash Courses antes de tentar novamente.'}</div>`;scrollTo({top:0,behavior:'smooth'})}
function resetSim(){simAnswers={};simulation();scrollTo({top:0})}
function filterSearch(term){term=term.toLowerCase().trim();if(!term)return;document.querySelectorAll('[data-search]').forEach(el=>el.style.display=el.dataset.search.toLowerCase().includes(term)?'':'none');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('exercises').classList.add('active')}
initNav();home();
</script>
</body></html>
